# Verifies that Platform Switcher installs as a VPM package with vrc-get
# and that its sources compile against the Unity reference assemblies.

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: io.github.hoppou-legion-gateway.platformswitcher
  CI_PROJECT: .github/ci-project

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Setup vrc-get
        uses: anatawa12/sh-actions/setup-vrc-get@1d155c7a26bcd0a54ffd9cb38fd66ab0d32d23cd # master
      - name: Install package into CI Unity project with vrc-get
        run: |
          # Stage a clean copy of the package (no .git/.github dot-folders)
          PKG_DIR="$RUNNER_TEMP/$PACKAGE_NAME"
          rm -rf "$PKG_DIR" && mkdir -p "$PKG_DIR"
          tar --exclude='./.*' -cf - . | tar -xf - -C "$PKG_DIR"
          vrc-get user-package add "$PKG_DIR"
          vrc-get install -y --project "$CI_PROJECT" \
            "$PACKAGE_NAME"
      - name: Resolve VPM packages
        run: |
          vrc-get resolve --project "$CI_PROJECT"
          vrc-get info project --project "$CI_PROJECT"
      - name: Restore dependencies
        run: dotnet restore "$CI_PROJECT/PlatformSwitcher.CI.csproj"
      - name: Build
        # Compile the vrc-get installed copy, not the checkout itself
        run: |
          dotnet build --no-restore "$CI_PROJECT/PlatformSwitcher.CI.csproj" \
            -p:PackageSourceDir="$PWD/$CI_PROJECT/Packages/$PACKAGE_NAME/"
